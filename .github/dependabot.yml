# Weekly update pull requests for the app's Gradle dependencies, the pinned Actions, and the tools CI installs.
# The verification-metadata workflow updates gradle/verification-metadata.xml on Gradle updates, which Dependabot
# doesn't; minor and patch updates come in one pull request, so that happens once a week.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /.github/commitlint
    schedule:
      interval: weekly
