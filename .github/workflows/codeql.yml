# Static analysis for security issues. Results: Security → Code scanning; pull requests fail on new alerts.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # started on a branch by the verification-metadata workflow
  schedule:
    - cron: "17 3 * * 1"   # weekly, to pick up new queries

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      security-events: write   # upload the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Install the Android SDK (cached, except for releases)
        uses: ./.github/actions/android-sdk
        with:
          cache: ${{ github.ref_type != 'tag' }}

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual         # Kotlin is analyzed by watching the compiler
          queries: security-extended

      - name: Compile (app and tests)
        run: ./gradlew compileReleaseKotlin compileReleaseUnitTestKotlin --rerun-tasks --console=plain

      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
